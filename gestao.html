<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Husky Gestão | Painel Operacional</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--blue:#3b6da6;--blue2:#577fac;--cream:#edd8ab;--paper:#f5f5f0;--brown:#5f442e;--ink:#171717;--muted:#6b7280;--line:#e5e7eb;--ok:#059669;--warn:#b45309;--danger:#dc2626;--shadow:0 18px 60px rgba(17,24,39,.10);--r:24px}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif} button,input,select,textarea{font:inherit} button{cursor:pointer;border:0} img{max-width:100%;display:block} .app{min-height:100vh;display:flex;max-width:1500px;margin:0 auto;background:white;box-shadow:var(--shadow)}
    .side{width:292px;flex-shrink:0;border-right:1px solid var(--line);padding:18px;background:white;display:none;overflow:auto;max-height:100vh;position:sticky;top:0} .main{flex:1;min-width:0;display:flex;flex-direction:column} .header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:16px} .content{padding:16px 16px 92px;overflow:auto} .bottom{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid var(--line);z-index:20;display:flex;gap:4px;overflow:auto;padding:8px}
    .logo{display:flex;align-items:center;gap:12px} .logo-mark{width:48px;height:48px;border-radius:16px;background:var(--blue);display:grid;place-items:center;overflow:hidden;color:white;font-size:26px} .logo strong{display:block;font-size:19px;line-height:1} .logo small{font-weight:900;color:var(--brown)} .nav{display:grid;gap:7px;margin-top:20px} .nav button,.bottom button{background:transparent;border-radius:16px;padding:11px 12px;text-align:left;font-weight:1000;color:var(--muted);white-space:nowrap} .nav button.active,.bottom button.active{background:var(--blue);color:white} .bottom button{font-size:12px;padding:9px 10px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px} .top h1{margin:0;font-size:26px;letter-spacing:-.03em} .top p{margin:4px 0 0;color:var(--muted);font-weight:800} .pill{display:inline-flex;align-items:center;border-radius:999px;background:var(--paper);padding:8px 12px;font-size:12px;font-weight:1000;color:var(--muted)} .btn{border-radius:15px;background:var(--blue);color:white;padding:12px 15px;font-weight:1000} .btn.dark{background:var(--ink)} .btn.ok{background:var(--ok)} .btn.warn{background:var(--warn)} .btn.danger{background:var(--danger)} .btn.ghost{background:var(--paper);color:var(--ink)} .btn.outline{background:white;color:var(--ink);border:2px solid var(--ink)} .grid{display:grid;gap:14px} .cards{grid-template-columns:repeat(2,1fr)} .card{border-radius:var(--r);background:white;box-shadow:0 12px 32px rgba(17,24,39,.07);padding:16px} .soft{background:var(--paper);box-shadow:none} .card h2,.card h3{margin:0 0 8px;font-weight:1000;letter-spacing:-.02em} .card p{color:var(--muted);font-weight:750;line-height:1.45} .metric{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;border-radius:24px;padding:17px} .metric small{font-weight:1000;color:rgba(255,255,255,.72)} .metric strong{display:block;font-size:28px;margin-top:5px} .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0} .input{border:0;background:var(--paper);border-radius:15px;padding:12px 13px;font-weight:850;outline:0;width:100%} textarea.input{min-height:92px;resize:vertical} .table-wrap{overflow:auto;border-radius:22px;border:1px solid var(--line)} table{width:100%;border-collapse:collapse;background:white;min-width:740px} th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px} th{background:var(--paper);font-weight:1000;color:#4b5563} td{font-weight:750} .status{border-radius:999px;padding:6px 9px;font-size:11px;font-weight:1000;background:var(--paper)} .status.ok{background:#ecfdf5;color:#047857} .status.warn{background:#fffbeb;color:#92400e} .status.danger{background:#fef2f2;color:#991b1b} .form-grid{display:grid;gap:10px} .modal{position:fixed;inset:0;background:rgba(0,0,0,.46);z-index:60;display:grid;place-items:center;padding:14px} .modal-box{max-width:780px;width:100%;max-height:calc(100vh - 28px);overflow:auto;background:white;border-radius:28px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.28)} .hidden{display:none!important} .login{min-height:100vh;display:grid;place-items:center;padding:18px;background:var(--paper)} .login-box{max-width:440px;width:100%;background:white;border-radius:32px;padding:22px;box-shadow:var(--shadow)} .alert{border-radius:18px;padding:12px;margin-top:12px;font-weight:800;background:var(--paper);color:#4b5563} .alert.err{background:#fef2f2;color:#991b1b} .alert.ok{background:#ecfdf5;color:#047857} .split{display:grid;gap:14px} .quick{display:flex;gap:8px;overflow:auto;padding-bottom:8px} .dangerText{color:var(--danger)} .muted{color:var(--muted);font-weight:800}
    @media(min-width:980px){.side{display:block}.bottom{display:none}.content{padding:24px}.cards{grid-template-columns:repeat(4,1fr)}.split{grid-template-columns:1.2fr .8fr}.form-grid{grid-template-columns:repeat(2,1fr)}.span2{grid-column:span 2}}
  </style>
</head>
<body>
<div id="root"></div>
<script>
const MODULES = [("dashboard", "Dashboard"), ("pedidos", "Pedidos"), ("producao", "Produção"), ("entregas", "Entregas"), ("cardapio", "Cardápio"), ("categorias", "Categorias"), ("adicionais", "Adicionais"), ("estoque", "Estoque"), ("loja", "Loja/Horários"), ("financeiro", "Financeiro"), ("cupons", "Cupons"), ("clientes", "Clientes"), ("avaliacoes", "Avaliações"), ("chat", "Chat/Suporte"), ("cancelamentos", "Cancelamentos"), ("reembolsos", "Reembolsos"), ("chamados", "Chamados"), ("relatorios", "Relatórios"), ("despesas", "Despesas"), ("fornecedores", "Fornecedores"), ("producao-dia", "Produção do dia"), ("manual", "Pedidos manuais"), ("canais", "Canais"), ("banners", "Banners"), ("notificacoes", "Notificações"), ("auditoria", "Auditoria"), ("usuarios", "Usuários"), ("entrega-zonas", "Área de entrega"), ("agendados", "Pedidos agendados"), ("fidelidade", "Fidelidade"), ("exportacao", "Exportação"), ("configuracoes", "Configurações")];
const CONFIG = window.HUSKY_CONFIG || {};
let supabaseClient = null;
let state = {session:null,user:null,admin:null,module:'dashboard',data:{products:[],orders:[],coupons:[],profiles:[],reviews:[],messages:[],settings:[],adminUsers:[],records:[],expenses:[],suppliers:[],banners:[],notifications:[],tickets:[],refunds:[],cancellations:[],inventory:[],production:[],channels:[],zones:[],audit:[]},message:'',search:'',editing:null};
const $ = (id)=>document.getElementById(id);
const money = (v)=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today = ()=>new Date().toISOString().slice(0,10);
function h(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function isConfigured(){return CONFIG.supabaseUrl && CONFIG.supabaseAnonKey && !String(CONFIG.supabaseUrl).includes('COLE_AQUI')}
function initSupabase(){if(!isConfigured()||!window.supabase)return null; if(!supabaseClient) supabaseClient=window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey); return supabaseClient}
async function init(){render(); const sb=initSupabase(); if(!sb)return; const {data}=await sb.auth.getSession(); state.session=data.session; state.user=data.session?.user||null; sb.auth.onAuthStateChange((_e,session)=>{state.session=session;state.user=session?.user||null;checkAdmin().then(loadAll)}); await checkAdmin(); await loadAll(); subscribeRealtime();}
async function checkAdmin(){const sb=initSupabase(); if(!sb||!state.user){state.admin=null;return} try{const {data,error}=await sb.from('admin_users').select('*').eq('user_id',state.user.id).eq('active',true).maybeSingle(); if(error)throw error; state.admin=data||null; if(data) await sb.from('admin_users').update({last_access_at:new Date().toISOString()}).eq('id',data.id)}catch(e){state.admin=null; state.message='Login feito, mas este e-mail ainda não está cadastrado como administrador. Rode o bloco CRIAR ADMIN do SQL.'}}
async function loginPassword(){const sb=initSupabase(); const email=$('email')?.value.trim(); const password=$('password')?.value; if(!sb){state.message='Supabase não configurado. Edite config.js.';render();return} const {error}=await sb.auth.signInWithPassword({email,password}); if(error){state.message='Erro no login: '+error.message;render();}}
async function sendOtp(){const sb=initSupabase(); const email=$('email')?.value.trim(); if(!sb){state.message='Supabase não configurado. Edite config.js.';render();return} const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}}); state.message=error?'Erro ao enviar código: '+error.message:'Código enviado para o e-mail.'; render();}
async function verifyOtp(){const sb=initSupabase(); const email=$('email')?.value.trim(); const token=$('otp')?.value.trim(); const {error}=await sb.auth.verifyOtp({email,token,type:'email'}); state.message=error?'Código inválido: '+error.message:'Código validado.'; render();}
async function logout(){const sb=initSupabase(); if(sb)await sb.auth.signOut(); state.session=null;state.user=null;state.admin=null;render();}
async function loadAll(){const sb=initSupabase(); if(!sb||!state.admin){render();return} await Promise.all([loadProducts(),loadOrders(),loadCoupons(),loadProfiles(),loadReviews(),loadMessages(),loadSettings(),loadAdminUsers(),loadRecords(),loadExpenses(),loadSuppliers(),loadBanners(),loadNotifications(),loadTickets(),loadRefunds(),loadCancellations(),loadInventory(),loadProduction(),loadChannels(),loadZones(),loadAudit()]); render();}
async function q(table, select='*'){const sb=initSupabase(); const {data,error}=await sb.from(table).select(select).order('created_at',{ascending:false}); if(error){console.warn(table,error.message); return []} return data||[]}
async function loadProducts(){state.data.products=await q('products')}
async function loadOrders(){state.data.orders=await q('customer_orders','*, order_items(*)')}
async function loadCoupons(){state.data.coupons=await q('coupons')}
async function loadProfiles(){state.data.profiles=await q('profiles')}
async function loadReviews(){state.data.reviews=await q('reviews')}
async function loadMessages(){state.data.messages=await q('chat_messages')}
async function loadSettings(){state.data.settings=await q('store_settings')}
async function loadAdminUsers(){state.data.adminUsers=await q('admin_users')}
async function loadRecords(){state.data.records=await q('admin_records')}
async function loadExpenses(){state.data.expenses=await q('expenses')}
async function loadSuppliers(){state.data.suppliers=await q('suppliers')}
async function loadBanners(){state.data.banners=await q('banners')}
async function loadNotifications(){state.data.notifications=await q('notifications')}
async function loadTickets(){state.data.tickets=await q('internal_tickets')}
async function loadRefunds(){state.data.refunds=await q('refunds')}
async function loadCancellations(){state.data.cancellations=await q('cancellations')}
async function loadInventory(){state.data.inventory=await q('inventory_movements')}
async function loadProduction(){state.data.production=await q('production_batches')}
async function loadChannels(){state.data.channels=await q('sales_channels')}
async function loadZones(){state.data.zones=await q('delivery_zones')}
async function loadAudit(){state.data.audit=await q('audit_logs')}
function subscribeRealtime(){const sb=initSupabase(); if(!sb)return; ['products','coupons','customer_orders','chat_messages','store_settings'].forEach(t=>{sb.channel('rt-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},()=>loadAll()).subscribe()})}
async function audit(action, entity, entityId, afterData){const sb=initSupabase(); if(!sb||!state.admin)return; await sb.from('audit_logs').insert({actor_id:state.user.id,actor_email:state.user.email,action,entity,entity_id:String(entityId||''),after_data:afterData||{}}).catch(()=>{})}
function setModule(m){state.module=m;state.editing=null;render()}
function nav(){return MODULES.map(([k,l])=>`<button class="${state.module===k?'active':''}" onclick="setModule('${k}')">${l}</button>`).join('')}
function render(){if(!isConfigured()) return renderConfig(); if(!state.user) return renderLogin(); if(!state.admin) return renderNoAdmin(); document.title='Husky Gestão | '+(MODULES.find(x=>x[0]===state.module)?.[1]||'Gestão'); $('root').innerHTML=`<div class="app"><aside class="side"><div class="logo"><div class="logo-mark">🐺</div><div><strong>Husky Gestão</strong><small>Painel operacional</small></div></div><div class="nav">${nav()}</div><button class="btn outline" style="width:100%;margin-top:16px" onclick="logout()">Sair</button></aside><main class="main"><header class="header"><div class="top"><div><h1>${MODULES.find(x=>x[0]===state.module)?.[1]||'Gestão'}</h1><p>${state.admin?.role||'admin'} • ${state.user?.email||''}</p></div><div><button class="btn ghost" onclick="loadAll()">Atualizar</button> <button class="btn dark" onclick="quickOpenClose()">Abrir/Fechar loja</button></div></div></header><section class="content">${screen()}</section></main><nav class="bottom">${nav()}</nav></div>${modal()}`;}
function renderConfig(){$('root').innerHTML=`<div class="login"><div class="login-box"><div class="logo"><div class="logo-mark">🐺</div><div><strong>Husky Gestão</strong><small>Configuração necessária</small></div></div><h2>Supabase não configurado</h2><p class="muted">Abra o arquivo <b>config.js</b> e preencha <b>supabaseUrl</b> e <b>supabaseAnonKey</b>. Depois salve e recarregue esta página.</p><div class="alert err">Sem isso, código por e-mail, login, cardápio, pedidos e gestão não funcionam.</div></div></div>`}
function renderLogin(){$('root').innerHTML=`<div class="login"><div class="login-box"><div class="logo"><div class="logo-mark">🐺</div><div><strong>Husky Gestão</strong><small>Login administrativo</small></div></div><h2>Entrar na gestão</h2><label class="input-label">E-mail</label><input id="email" class="input" placeholder="admin@email.com"><label>Senha</label><input id="password" type="password" class="input" placeholder="Senha"><button class="btn full" style="width:100%;margin-top:12px" onclick="loginPassword()">Entrar com senha</button><div class="grid" style="margin-top:14px"><input id="otp" class="input" placeholder="Código recebido por e-mail"><button class="btn ghost" onclick="sendOtp()">Enviar código</button><button class="btn outline" onclick="verifyOtp()">Validar código</button></div>${state.message?`<div class="alert">${h(state.message)}</div>`:''}<p class="muted">O cliente nunca acessa esta tela. O e-mail precisa estar cadastrado em <b>admin_users</b>.</p></div></div>`}
function renderNoAdmin(){$('root').innerHTML=`<div class="login"><div class="login-box"><h2>Acesso bloqueado</h2><p class="muted">Você está logado como <b>${h(state.user?.email)}</b>, mas esse usuário ainda não está em <b>admin_users</b>.</p><div class="alert err">No Supabase SQL Editor, rode o bloco CRIAR ADMIN no final do SQL, trocando pelo seu e-mail.</div><button class="btn outline" onclick="logout()">Sair</button>${state.message?`<div class="alert">${h(state.message)}</div>`:''}</div></div>`}
function screen(){const m=state.module; if(m==='dashboard')return dashboard(); if(m==='pedidos')return orders(); if(m==='producao')return productionScreen(); if(m==='entregas')return deliveries(); if(m==='cardapio')return productsScreen(); if(m==='cupons')return couponsScreen(); if(m==='clientes')return customers(); if(m==='financeiro')return finance(); if(m==='relatorios')return reports(); if(m==='chat')return chat(); if(m==='estoque')return stock(); if(m==='loja'||m==='configuracoes')return settingsScreen(); if(m==='usuarios')return usersScreen(); if(m==='avaliacoes')return reviews(); if(m==='despesas')return expenses(); if(m==='fornecedores')return suppliers(); if(m==='banners')return banners(); if(m==='notificacoes')return notifications(); if(m==='auditoria')return auditScreen(); if(m==='categorias')return genericTable('product_categories','Categorias','name, slug, description, image_url, active, sort_order'); if(m==='adicionais')return genericTable('product_addons','Adicionais','product_id, group_name, name, price, active, required, min_choices, max_choices, stock'); if(m==='cancelamentos')return genericModule('cancellations','Cancelamentos'); if(m==='reembolsos')return genericModule('refunds','Reembolsos'); if(m==='chamados')return tickets(); if(m==='producao-dia')return productionDay(); if(m==='manual')return manualOrders(); if(m==='canais')return genericTable('sales_channels','Canais de venda','name, active, config'); if(m==='entrega-zonas')return genericTable('delivery_zones','Área de entrega','name, fee, min_order, estimated_minutes, active, rules'); if(m==='agendados')return genericModule('scheduled_orders','Pedidos agendados'); if(m==='fidelidade')return genericTable('loyalty_rules','Fidelidade','name, type, value, active'); if(m==='exportacao')return exportScreen(); return dashboard()}
function metrics(){const orders=state.data.orders, products=state.data.products; const todayStr=today(); const todayOrders=orders.filter(o=>(o.created_at||'').slice(0,10)===todayStr); const revenue=todayOrders.reduce((s,o)=>s+Number(o.total||0),0); return {orders,todayOrders,revenue,products,lowStock:products.filter(p=>Number(p.stock||0)<=Number(p.min_stock||0||2)).length}}
function dashboard(){const m=metrics(); return `<div class="grid cards"><div class="metric"><small>Faturamento hoje</small><strong>${money(m.revenue)}</strong></div><div class="metric"><small>Pedidos hoje</small><strong>${m.todayOrders.length}</strong></div><div class="metric"><small>Em produção</small><strong>${m.orders.filter(o=>['accepted','preparing','packing'].includes(o.status)).length}</strong></div><div class="metric"><small>Estoque baixo</small><strong>${m.lowStock}</strong></div></div><div class="split mt"><div class="card"><h2>Pedidos que precisam de atenção</h2>${orderCards(m.orders.filter(o=>!['done','cancelled'].includes(o.status)).slice(0,8))}</div><div class="card soft"><h2>Ações rápidas</h2><div class="grid"><button class="btn" onclick="setModule('pedidos')">Ver pedidos</button><button class="btn" onclick="state.editing={table:'products'};render()">Criar produto</button><button class="btn" onclick="state.editing={table:'coupons'};render()">Criar cupom</button><button class="btn dark" onclick="quickOpenClose()">Abrir/fechar loja</button><button class="btn ghost" onclick="window.print()">Imprimir resumo</button></div></div></div>`}
function orderCards(list){if(!list.length)return '<p class="muted">Nenhum pedido pendente.</p>'; return `<div class="grid">${list.map(o=>`<div class="card soft"><div class="top"><div><b>#${h(o.order_number)}</b><p>${h(o.customer_name||'Cliente')} • ${money(o.total)} • ${h(o.fulfillment)}</p></div><span class="status ${o.payment_status==='approved'?'ok':'warn'}">${h(o.status)}</span></div><div class="toolbar"><button class="btn ok" onclick="updateOrderStatus('${o.id}','accepted')">Aceitar</button><button class="btn" onclick="updateOrderStatus('${o.id}','preparing')">Produção</button><button class="btn" onclick="updateOrderStatus('${o.id}','packing')">Embalando</button><button class="btn" onclick="updateOrderStatus('${o.id}','delivery')">Saiu/Pronto</button><button class="btn dark" onclick="updateOrderStatus('${o.id}','done')">Entregue</button><button class="btn danger" onclick="updateOrderStatus('${o.id}','cancelled')">Cancelar</button></div></div>`).join('')}</div>`}
function orders(){return `<div class="toolbar"><input class="input" style="max-width:320px" placeholder="Buscar pedido, cliente, status..." oninput="state.search=this.value.toLowerCase();render()"><button class="btn" onclick="setModule('manual')">Criar pedido manual</button></div>${ordersTable(state.data.orders.filter(o=>JSON.stringify(o).toLowerCase().includes(state.search||'')))}`}
function ordersTable(list){return `<div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Status</th><th>Pagamento</th><th>Entrega/retirada</th><th>Valor</th><th>Ações</th></tr></thead><tbody>${list.map(o=>`<tr><td><b>#${h(o.order_number)}</b><br><small>${new Date(o.created_at).toLocaleString('pt-BR')}</small></td><td>${h(o.customer_name||'')}<br><small>${h(o.customer_phone||'')}</small></td><td><span class="status">${h(o.status)}</span></td><td><span class="status ${o.payment_status==='approved'?'ok':'warn'}">${h(o.payment_status)}</span></td><td>${h(o.fulfillment)}</td><td><b>${money(o.total)}</b></td><td><button class="btn ghost" onclick="openOrder('${o.id}')">Detalhes</button></td></tr>`).join('')}</tbody></table></div>`}
function productionScreen(){const list=state.data.orders.filter(o=>['accepted','preparing','packing'].includes(o.status)); const counts={}; list.forEach(o=>(o.order_items||[]).forEach(i=>counts[i.product_name]=(counts[i.product_name]||0)+Number(i.quantity||0))); return `<div class="grid cards">${Object.entries(counts).map(([k,v])=>`<div class="metric"><small>${h(k)}</small><strong>${v}</strong></div>`).join('')||'<div class="card">Nenhum item em produção.</div>'}</div><div class="mt">${orderCards(list)}</div>`}
function deliveries(){return `<div class="card"><h2>Entregas e retiradas</h2>${ordersTable(state.data.orders.filter(o=>['packing','delivery','ready'].includes(o.status)||o.fulfillment==='delivery'))}</div>`}
function productsScreen(){return `<div class="toolbar"><button class="btn" onclick="state.editing={table:'products'};render()">Novo produto</button></div>${crudTable('products', state.data.products, ['name','price','stock','active','available','visible_on_client','tag'], productForm)}`}
function couponsScreen(){return `<div class="toolbar"><button class="btn" onclick="state.editing={table:'coupons'};render()">Novo cupom</button></div>${crudTable('coupons', state.data.coupons, ['code','title','discount_type','discount_value','min_subtotal','active'], couponForm)}`}
function customers(){return crudTable('profiles', state.data.profiles, ['name','email','phone','address','status'], null, false)}
function reviews(){return crudTable('reviews', state.data.reviews, ['rating','comment','store_reply','status'], reviewForm)}
function stock(){return `<div class="split"><div>${crudTable('inventory_movements', state.data.inventory, ['type','quantity','reason','lot','expiration_date'], stockForm)}</div><div class="card"><h2>Estoque atual</h2>${crudTable('products', state.data.products, ['name','stock','min_stock','available'], productStockForm)}</div></div>`}
function finance(){const paid=state.data.orders.filter(o=>o.payment_status==='approved'); const total=paid.reduce((s,o)=>s+Number(o.total||0),0); const discounts=paid.reduce((s,o)=>s+Number(o.discount||0),0); return `<div class="grid cards"><div class="metric"><small>Bruto aprovado</small><strong>${money(total)}</strong></div><div class="metric"><small>Descontos</small><strong>${money(discounts)}</strong></div><div class="metric"><small>Pedidos pagos</small><strong>${paid.length}</strong></div><div class="metric"><small>Ticket médio</small><strong>${money(paid.length?total/paid.length:0)}</strong></div></div><div class="mt">${ordersTable(paid)}</div>`}
function reports(){return `<div class="grid cards"><div class="card"><h2>Vendas</h2><p>Dia, semana, mês, produto, categoria, canal e forma de pagamento.</p></div><div class="card"><h2>Produtos</h2><p>Mais vendido, menor venda, maior faturamento, cancelados e avaliações.</p></div><div class="card"><h2>Clientes</h2><p>Novos, recorrentes, inativos, ranking e ticket médio.</p></div><div class="card"><h2>Operação</h2><p>Tempo de aceite, produção, entrega, atrasos e cancelamentos.</p></div></div><div class="mt">${finance()}</div>`}
function chat(){return `<div class="split"><div class="card"><h2>Mensagens</h2>${crudTable('chat_messages', state.data.messages, ['sender','message','created_at'], chatForm)}</div><div class="card soft"><h2>Mensagens rápidas</h2>${['Recebemos seu pedido e já vamos iniciar o preparo.','Seu pedido está em produção.','Seu pedido está sendo embalado.','Seu pedido saiu para entrega.','Tivemos um pequeno atraso, mas já estamos finalizando.'].map(t=>`<button class="btn ghost" style="margin:4px" onclick="copyText('${h(t)}')">${h(t)}</button>`).join('')}</div></div>`}
function settingsScreen(){return `<div class="card"><h2>Configurações da loja</h2><p>Nome, logo, capa, WhatsApp, horários, loja aberta/fechada, entrega, aparência, banners e políticas.</p>${crudTable('store_settings', state.data.settings, ['key','value'], settingsForm)}</div>`}
function usersScreen(){return `<div class="card"><h2>Usuários e permissões</h2><button class="btn" onclick="state.editing={table:'admin_users'};render()">Novo usuário</button>${crudTable('admin_users', state.data.adminUsers, ['email','name','role','active','last_access_at'], userForm)}</div>`}
function expenses(){return crudTable('expenses', state.data.expenses, ['name','category','amount','date','payment_method','recurring'], expenseForm)}
function suppliers(){return crudTable('suppliers', state.data.suppliers, ['name','phone','email','product_supplied','active'], supplierForm)}
function banners(){return crudTable('banners', state.data.banners, ['title','subtitle','image_url','active','sort_order'], bannerForm)}
function notifications(){return crudTable('notifications', state.data.notifications, ['type','title','message','read_at'], null, false)}
function auditScreen(){return crudTable('audit_logs', state.data.audit, ['actor_email','action','entity','entity_id','created_at'], null, false)}
function tickets(){return crudTable('internal_tickets', state.data.tickets, ['title','type','priority','status','description'], genericJsonForm('internal_tickets'))}
function productionDay(){return crudTable('production_batches', state.data.production, ['title','quantity','sold_quantity','lost_quantity','leftover_quantity','lot'], genericJsonForm('production_batches'))}
function manualOrders(){return `<div class="card"><h2>Pedidos manuais</h2><p>Crie pedidos de WhatsApp, Instagram, presencial e balcão para manter relatórios reais.</p><button class="btn" onclick="state.editing={table:'admin_records',type:'manual_order'};render()">Criar pedido manual</button>${genericModule('manual_order','Pedidos manuais')}</div>`}
function genericModule(type,title){const list=state.data.records.filter(r=>r.type===type); return `<div class="card"><h2>${title}</h2><button class="btn" onclick="state.editing={table:'admin_records',type:'${type}'};render()">Novo registro</button>${crudTable('admin_records', list, ['title','status','data','created_at'], genericRecordForm(type))}</div>`}
function genericTable(table,title,fields){const map={product_categories:'categories',product_addons:'addons',sales_channels:'channels',delivery_zones:'zones',loyalty_rules:'loyalty'}; const key=map[table]||'records'; const data=state.data[key]||[]; return `<div class="card"><h2>${title}</h2><button class="btn" onclick="state.editing={table:'${table}'};render()">Novo</button>${crudTable(table,data,fields.split(',').map(x=>x.trim()),genericJsonForm(table))}</div>`}
function exportScreen(){return `<div class="card"><h2>Exportação</h2><p>Exporte pedidos, clientes, vendas, estoque, financeiro, despesas e avaliações em CSV.</p><div class="toolbar"><button class="btn" onclick="downloadCSV('pedidos',state.data.orders)">Pedidos CSV</button><button class="btn" onclick="downloadCSV('clientes',state.data.profiles)">Clientes CSV</button><button class="btn" onclick="downloadCSV('produtos',state.data.products)">Produtos CSV</button><button class="btn" onclick="downloadCSV('financeiro',state.data.orders)">Financeiro CSV</button></div></div>`}
function crudTable(table, rows, fields, formFn, editable=true){return `<div class="table-wrap mt"><table><thead><tr>${fields.map(f=>`<th>${f}</th>`).join('')}${editable?'<th>Ações</th>':''}</tr></thead><tbody>${(rows||[]).map(r=>`<tr>${fields.map(f=>`<td>${formatCell(r[f])}</td>`).join('')}${editable?`<td><button class="btn ghost" onclick='editRow(${JSON.stringify(table)},${JSON.stringify(r.id)})'>Editar</button></td>`:''}</tr>`).join('')||`<tr><td colspan="${fields.length+1}">Nenhum registro.</td></tr>`}</tbody></table></div>`}
function formatCell(v){if(v===true)return '<span class="status ok">Sim</span>'; if(v===false)return '<span class="status danger">Não</span>'; if(typeof v==='object'&&v)return `<pre style="white-space:pre-wrap;max-width:280px">${h(JSON.stringify(v,null,1))}</pre>`; return h(v)}
function getTableRows(table){const m={products:'products',coupons:'coupons',profiles:'profiles',reviews:'reviews',inventory_movements:'inventory',store_settings:'settings',admin_users:'adminUsers',expenses:'expenses',suppliers:'suppliers',banners:'banners',notifications:'notifications',internal_tickets:'tickets',refunds:'refunds',cancellations:'cancellations',production_batches:'production',sales_channels:'channels',delivery_zones:'zones',audit_logs:'audit'}; return state.data[m[table]]||[]}
function editRow(table,id){state.editing={table,id};render()}
function modal(){if(!state.editing)return ''; const table=state.editing.table; const row=state.editing.id?getTableRows(table).find(r=>r.id===state.editing.id)||{}:{}; const forms={products:productForm,coupons:couponForm,reviews:reviewForm,inventory_movements:stockForm,store_settings:settingsForm,admin_users:userForm,expenses:expenseForm,suppliers:supplierForm,banners:bannerForm,chat_messages:chatForm}; const fn=forms[table]||genericJsonForm(table); return `<div class="modal"><div class="modal-box"><div class="top"><h2>${row.id?'Editar':'Novo'} ${h(table)}</h2><button class="btn ghost" onclick="state.editing=null;render()">Fechar</button></div>${fn(row,state.editing.type||'')}</div></div>`}
function input(name,label,value='',type='text'){return `<label><span class="muted">${label}</span><input class="input" id="f_${name}" type="${type}" value="${h(value)}"></label>`}
function textarea(name,label,value=''){return `<label class="span2"><span class="muted">${label}</span><textarea class="input" id="f_${name}">${h(value)}</textarea></label>`}
function checkbox(name,label,value=false){return `<label><input id="f_${name}" type="checkbox" ${value?'checked':''}> <b>${label}</b></label>`}
function productForm(r={}){return `<div class="form-grid">${input('name','Nome',r.name)}${input('slug','Slug',r.slug)}${input('price','Preço',r.price,'number')}${input('promo_price','Preço promocional',r.promo_price,'number')}${input('stock','Estoque',r.stock,'number')}${input('min_stock','Estoque mínimo',r.min_stock,'number')}${input('tag','Tag',r.tag)}${input('image_url','Imagem',r.image_url)}${textarea('description','Descrição curta',r.description)}${textarea('details','Descrição completa',r.details)}${textarea('ingredients','Ingredientes',r.ingredients)}${textarea('allergens','Alergênicos',r.allergens)}${checkbox('active','Ativo',r.active!==false)}${checkbox('available','Disponível',r.available!==false)}${checkbox('visible_on_client','Mostrar no app do cliente',r.visible_on_client!==false)}${checkbox('featured','Destaque',r.featured===true)}</div><button class="btn mt" onclick="saveProduct('${r.id||''}')">Salvar produto</button>`}
function couponForm(r={}){return `<div class="form-grid">${input('code','Código',r.code)}${input('title','Título',r.title)}${input('discount_type','Tipo: value/percent/free_delivery',r.discount_type||'value')}${input('discount_value','Valor desconto',r.discount_value,'number')}${input('min_subtotal','Valor mínimo',r.min_subtotal,'number')}${input('min_items','Itens mínimos',r.min_items,'number')}${textarea('description','Descrição',r.description)}${checkbox('active','Ativo',r.active!==false)}</div><button class="btn mt" onclick="saveCoupon('${r.id||''}')">Salvar cupom</button>`}
function reviewForm(r={}){return `<div class="form-grid">${input('rating','Nota',r.rating,'number')}${textarea('comment','Comentário',r.comment)}${textarea('store_reply','Resposta da loja',r.store_reply)}${input('status','Status',r.status||'respondida')}</div><button class="btn mt" onclick="saveGeneric('reviews','${r.id||''}')">Salvar avaliação</button>`}
function stockForm(r={}){return `<div class="form-grid">${input('product_id','ID Produto',r.product_id)}${input('type','Tipo entrada/saida/ajuste',r.type||'entrada')}${input('quantity','Quantidade',r.quantity,'number')}${input('reason','Motivo',r.reason)}${input('lot','Lote',r.lot)}${input('expiration_date','Validade',r.expiration_date,'date')}</div><button class="btn mt" onclick="saveGeneric('inventory_movements','${r.id||''}')">Salvar movimento</button>`}
function settingsForm(r={}){return `<div class="form-grid">${input('key','Chave',r.key)}${textarea('value','JSON de configuração',JSON.stringify(r.value||{},null,2))}</div><button class="btn mt" onclick="saveSettings('${r.id||''}')">Salvar configuração</button>`}
function userForm(r={}){return `<div class="form-grid">${input('email','E-mail',r.email)}${input('name','Nome',r.name)}${input('role','Cargo admin/operador/atendente/producao/entregador/financeiro',r.role||'operador')}${textarea('permissions','Permissões JSON',JSON.stringify(r.permissions||{},null,2))}${checkbox('active','Ativo',r.active!==false)}</div><button class="btn mt" onclick="saveUser('${r.id||''}')">Salvar usuário</button>`}
function expenseForm(r={}){return `<div class="form-grid">${input('name','Despesa',r.name)}${input('category','Categoria',r.category)}${input('amount','Valor',r.amount,'number')}${input('date','Data',r.date||today(),'date')}${input('payment_method','Forma de pagamento',r.payment_method)}${input('quantity','Quantidade',r.quantity,'number')}${textarea('notes','Observação',r.notes)}${checkbox('recurring','Recorrente',r.recurring===true)}</div><button class="btn mt" onclick="saveGeneric('expenses','${r.id||''}')">Salvar despesa</button>`}
function supplierForm(r={}){return `<div class="form-grid">${input('name','Fornecedor',r.name)}${input('phone','Telefone',r.phone)}${input('email','E-mail',r.email)}${input('product_supplied','Produto fornecido',r.product_supplied)}${input('average_value','Valor médio',r.average_value,'number')}${textarea('notes','Observações',r.notes)}${checkbox('active','Ativo',r.active!==false)}</div><button class="btn mt" onclick="saveGeneric('suppliers','${r.id||''}')">Salvar fornecedor</button>`}
function bannerForm(r={}){return `<div class="form-grid">${input('title','Título',r.title)}${input('subtitle','Subtítulo',r.subtitle)}${input('image_url','Imagem',r.image_url)}${input('link_type','Tipo de link',r.link_type)}${input('link_target','Destino',r.link_target)}${input('sort_order','Ordem',r.sort_order,'number')}${checkbox('active','Ativo',r.active!==false)}</div><button class="btn mt" onclick="saveGeneric('banners','${r.id||''}')">Salvar banner</button>`}
function chatForm(r={}){return `<div class="form-grid">${input('user_id','ID do cliente',r.user_id)}${input('order_id','ID do pedido',r.order_id)}${input('sender','sender customer/store/system',r.sender||'store')}${textarea('message','Mensagem',r.message)}</div><button class="btn mt" onclick="saveGeneric('chat_messages','${r.id||''}')">Enviar/salvar mensagem</button>`}
function genericRecordForm(type){return (r={})=>`<div class="form-grid">${input('title','Título',r.title)}${input('status','Status',r.status||'active')}${textarea('data','Dados JSON',JSON.stringify(r.data||{},null,2))}</div><button class="btn mt" onclick="saveRecord('${type}','${r.id||''}')">Salvar</button>`}
function genericJsonForm(table){return (r={})=>`<div class="form-grid">${textarea('json','Dados JSON',JSON.stringify(r,null,2))}</div><button class="btn mt" onclick="saveJson('${table}','${r.id||''}')">Salvar</button>`}
function field(id){const el=$('f_'+id); if(!el)return null; if(el.type==='checkbox')return el.checked; if(el.type==='number')return el.value===''?null:Number(el.value); return el.value}
async function saveProduct(id){const p={name:field('name'),slug:field('slug'),price:field('price'),promo_price:field('promo_price'),stock:field('stock'),min_stock:field('min_stock'),tag:field('tag'),image_url:field('image_url'),description:field('description'),details:field('details'),ingredients:field('ingredients'),allergens:field('allergens'),active:field('active'),available:field('available'),visible_on_client:field('visible_on_client'),featured:field('featured')}; await upsert('products',id,p);}
async function saveCoupon(id){const p={code:field('code'),title:field('title'),discount_type:field('discount_type'),discount_value:field('discount_value'),min_subtotal:field('min_subtotal'),min_items:field('min_items'),description:field('description'),active:field('active')}; await upsert('coupons',id,p);}
async function saveSettings(id){let v={}; try{v=JSON.parse(field('value')||'{}')}catch(e){alert('JSON inválido');return} await upsert('store_settings',id,{key:field('key'),value:v,updated_by:state.user.id});}
async function saveUser(id){let perms={}; try{perms=JSON.parse(field('permissions')||'{}')}catch(e){} await upsert('admin_users',id,{email:field('email'),name:field('name'),role:field('role'),permissions:perms,active:field('active')});}
async function saveGeneric(table,id){const obj={}; document.querySelectorAll('[id^="f_"]').forEach(el=>{const k=el.id.replace('f_',''); obj[k]=el.type==='checkbox'?el.checked:(el.type==='number'?Number(el.value||0):el.value)}); await upsert(table,id,obj);}
async function saveRecord(type,id){let data={}; try{data=JSON.parse(field('data')||'{}')}catch(e){alert('JSON inválido');return} await upsert('admin_records',id,{type,title:field('title'),status:field('status'),data,created_by:state.user.id});}
async function saveJson(table,id){let data; try{data=JSON.parse(field('json')||'{}')}catch(e){alert('JSON inválido');return} delete data.id; await upsert(table,id,data);}
async function upsert(table,id,payload){const sb=initSupabase(); let res; if(id)res=await sb.from(table).update(payload).eq('id',id).select().single(); else res=await sb.from(table).insert(payload).select().single(); if(res.error){alert(res.error.message);return} await audit(id?'update':'insert',table,id||res.data.id,payload); state.editing=null; await loadAll();}
async function updateOrderStatus(id,status){const sb=initSupabase(); const order=state.data.orders.find(o=>o.id===id); if(!order)return; const {error}=await sb.from('customer_orders').update({status,[status==='accepted'?'accepted_at':status==='done'?'delivered_at':'updated_at']:new Date().toISOString()}).eq('id',id); if(error){alert(error.message);return} await sb.from('order_history').insert({order_id:id,status,note:'Status alterado pela gestão',actor_id:state.user.id,actor_name:state.admin?.name||state.user.email}); await audit('status', 'customer_orders', id, {from:order.status,to:status}); await loadAll();}
function openOrder(id){const o=state.data.orders.find(x=>x.id===id); if(!o)return; state.editing={table:'order_detail',order:o}; render()}
function modalOrder(o){return `<div class="modal"><div class="modal-box"><div class="top"><h2>Pedido #${h(o.order_number)}</h2><button class="btn ghost" onclick="state.editing=null;render()">Fechar</button></div><div class="grid"><div class="card soft"><h3>Cliente</h3><p>${h(o.customer_name)}<br>${h(o.customer_phone)}<br>${h(o.customer_email)}<br>${h(JSON.stringify(o.address_snapshot||{}))}</p></div><div class="card soft"><h3>Pagamento</h3><p>Status: ${h(o.payment_status)}<br>Total: ${money(o.total)}<br>Cupom: ${h(o.coupon_code||'-')}</p></div><div class="card soft"><h3>Itens</h3>${(o.order_items||[]).map(i=>`<p><b>${i.quantity}x ${h(i.product_name)}</b> — ${money(i.total)}<br>${h(i.observation||'')}</p>`).join('')}</div></div><div class="toolbar"><button class="btn ok" onclick="updateOrderStatus('${o.id}','accepted')">Aceitar</button><button class="btn" onclick="updateOrderStatus('${o.id}','preparing')">Produção</button><button class="btn" onclick="updateOrderStatus('${o.id}','packing')">Embalando</button><button class="btn" onclick="updateOrderStatus('${o.id}','delivery')">Saiu/Pronto</button><button class="btn dark" onclick="updateOrderStatus('${o.id}','done')">Entregue</button><button class="btn danger" onclick="updateOrderStatus('${o.id}','cancelled')">Cancelar</button></div></div></div>`}
const oldModal=modal; modal=function(){if(state.editing?.table==='order_detail')return modalOrder(state.editing.order); return oldModal();}
async function quickOpenClose(){const sb=initSupabase(); let row=state.data.settings.find(x=>x.key==='store'); let value=row?.value||{}; value.open=!value.open; if(row) await sb.from('store_settings').update({value,updated_by:state.user.id}).eq('id',row.id); else await sb.from('store_settings').insert({key:'store',value,updated_by:state.user.id}); await audit('toggle_store','store_settings',row?.id,value); await loadAll();}
function copyText(t){navigator.clipboard?.writeText(t).catch(()=>{})}
function downloadCSV(name, rows){
  const arr=rows||[];
  if(!arr.length)return alert('Sem dados.');
  const keys=Object.keys(arr[0]);
  const csv=[keys.join(';'),...arr.map(r=>keys.map(k=>`"${String(typeof r[k]==='object'?JSON.stringify(r[k]):r[k]??'').replace(/"/g,'""')}"`).join(';'))].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=name+'.csv';
  a.click();
}
window.setModule=setModule; window.logout=logout; window.loginPassword=loginPassword; window.sendOtp=sendOtp; window.verifyOtp=verifyOtp; window.loadAll=loadAll; window.updateOrderStatus=updateOrderStatus; window.openOrder=openOrder; window.quickOpenClose=quickOpenClose; window.editRow=editRow; window.saveProduct=saveProduct; window.saveCoupon=saveCoupon; window.saveGeneric=saveGeneric; window.saveSettings=saveSettings; window.saveUser=saveUser; window.saveRecord=saveRecord; window.saveJson=saveJson; window.downloadCSV=downloadCSV; window.copyText=copyText; init();
</script>
</body>
