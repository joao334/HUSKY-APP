<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Limpar sessões Husky</title>
<style>body{font-family:Arial;background:#f5f5f0;padding:30px;color:#171717}.box{max-width:620px;margin:auto;background:white;border-radius:24px;padding:24px;box-shadow:0 18px 45px #0001}button{border:0;border-radius:16px;background:#3b6da6;color:white;padding:14px 18px;font-weight:900;cursor:pointer}.muted{color:#666;font-weight:700}</style></head>
<body><div class="box">
<h1>Limpar sessões antigas</h1>
<p class="muted">Use esta página uma vez se o navegador misturou cliente e gestão por causa da versão antiga do app.</p>
<button onclick="limpar()">Limpar sessões e voltar ao cliente</button>
<pre id="out"></pre>
</div>
<script>
function limpar(){
  const removidos=[];
  Object.keys(localStorage).forEach(k=>{
    if(k.includes('supabase') || k.includes('auth-token') || k.includes('husky_admin_user') || k.includes('husky_cliente_auth') || k.includes('husky_gestao_auth')){
      localStorage.removeItem(k); removidos.push(k);
    }
  });
  document.getElementById('out').textContent='Removido:\n'+removidos.join('\n');
  setTimeout(()=>location.href='/',1200);
}
</script></body></html>
